# infrastructure/deployment/nginx.conf
# Production Nginx Configuration for MIT Uniform Management System

# 1. Main Student Portal (uniforms.mitmysore.in)
server {
    listen 80;
    server_name uniforms.mitmysore.in;

    location / {
        root /var/www/mit-uniform/apps/student-portal/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests directly to Backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy public uploads
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
    }
}

# 2. Admin Management Panel (admin.mitmysore.in)
server {
    listen 80;
    server_name admin.mitmysore.in;

    location / {
        root /var/www/mit-uniform/apps/admin-portal/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Backend API & SSE Realtime Stream (api.uniforms.mitmysore.in)
server {
    listen 80;
    server_name api.uniforms.mitmysore.in;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (SSE) requires unbuffered streaming
    location /api/sse {
        proxy_pass http://127.0.0.1:4000/api/sse;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
    }
}
