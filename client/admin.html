<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIT Mysore – Admin Panel | Uniform Management System</title>
    <link rel="icon" type="image/png" href="/mit-logo.png" />
    <meta name="description" content="MIT Mysore Uniform Administration Panel – Manage student registrations, distribution schedules, size reports, and department data." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) { reg.unregister(); }
        });
      }
    </script>
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
